name: Rust Security

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: rust-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-client-server-with-database/server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Cargo audit
        # actix-http currently depends on h2 0.3.x; the fixed h2 0.4.x release is
        # API-incompatible. Keep this narrow exception until Actix upgrades it.
        run: cargo audit --ignore RUSTSEC-2026-0258

      - name: Cargo deny (advisories)
        run: cargo deny check --config ../../deny.toml advisories
